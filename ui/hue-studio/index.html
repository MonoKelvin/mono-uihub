<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eeedf0">
  <meta name="description" content="色序，五色搭配生成与编辑，提供六种风格、实时应用预览和色卡导出。">
  <title>色序 hue — 配色工作室</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.49.0/dist/tabler-icons-300.min.css">
  <link rel="stylesheet" href="./styles.css">
  <script defer src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
  <script defer src="./app.js"></script>
</head>
<body>
  <main class="stage">
    <section class="canvas" aria-label="色序配色生成器">
      <header class="header">
        <a class="brand" href="./index.html" aria-label="色序首页">
          <span class="brand-symbol" aria-hidden="true"><b></b><b></b><b></b><b></b><b></b></span>
          <span class="brand-word">hue<span>.</span></span>
          <span class="brand-name">色序</span>
        </a>
        <div class="header-actions">
          <button class="icon-button" id="copy-all" aria-label="复制全部色值" data-tip="复制五色色值"><i class="ti ti-copy" aria-hidden="true"></i></button>
          <span class="action-divider" aria-hidden="true"></span>
          <button class="export-button" id="export-button"><i class="ti ti-download" aria-hidden="true"></i><span>导出</span></button>
        </div>
      </header>
      <nav class="styles" aria-label="配色风格" id="style-list"></nav>
      <div class="workspace-mode" role="group" aria-label="工作区">
        <button data-workspace="palette" aria-pressed="true">配色</button>
        <button data-workspace="preview" aria-pressed="false">应用预览</button>
      </div>
      <div class="workspace">
        <section class="palette-area" aria-labelledby="palette-title">
          <div class="palette-heading"><h1 id="palette-title">石灰与烟紫</h1><span class="lock-hint" id="lock-hint" hidden></span></div>
          <div class="swatches" id="swatches" aria-label="五色搭配"></div>
          <div class="generation-bar">
            <button class="generate-button" id="generate"><span class="generate-icon"><i class="ti ti-dice-5" aria-hidden="true"></i></span><span id="generate-label">生成配色</span><kbd aria-hidden="true">空格</kbd></button>
            <div class="concentration">
              <div class="concentration-label"><label for="concentration">浓度</label><span id="concentration-value">适中</span></div>
              <div class="range-row"><i class="ti ti-droplet-half-2" aria-hidden="true"></i><input type="range" id="concentration" min="0" max="100" value="50" aria-label="色彩浓度"><i class="ti ti-droplet" aria-hidden="true"></i></div>
            </div>
          </div>
        </section>
        <section class="preview-area" aria-label="配色应用预览">
          <div class="preview-frame" id="preview-frame">
            <div class="preview-view sculpture-view" data-view="sculpture">
              <svg class="sculpture" id="sculpture" viewBox="0 0 440 360" role="img" aria-label="五色静物雕塑">
                <defs>
                  <linearGradient id="arch-light" x1="0" y1="0" x2="1" y2=".2"><stop stop-color="#fff" stop-opacity=".36"/><stop offset=".5" stop-color="#fff" stop-opacity=".04"/><stop offset="1" stop-color="#000" stop-opacity=".16"/></linearGradient>
                  <linearGradient id="cube-light" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#000" stop-opacity=".05"/><stop offset="1" stop-color="#000" stop-opacity=".22"/></linearGradient>
                  <radialGradient id="sphere-light" cx=".28" cy=".23" r=".8"><stop stop-color="#fff" stop-opacity=".5"/><stop offset=".45" stop-color="#fff" stop-opacity=".06"/><stop offset="1" stop-color="#000" stop-opacity=".3"/></radialGradient>
                  <linearGradient id="cylinder-light"><stop stop-color="#000" stop-opacity=".2"/><stop offset=".38" stop-color="#fff" stop-opacity=".12"/><stop offset="1" stop-color="#000" stop-opacity=".15"/></linearGradient>
                  <filter id="floor-shadow" x="-.3" y="-1" width="1.6" height="3"><feGaussianBlur stdDeviation="7"/></filter>
                  <filter id="contact-shadow" x="-.5" y="-1" width="2" height="3"><feGaussianBlur stdDeviation="3"/></filter>
                </defs>
                <ellipse cx="234" cy="304" rx="158" ry="13" fill="#1e1a20" opacity=".13" filter="url(#floor-shadow)"/>
                <g class="sculpture-piece pedestal" data-material="0">
                  <path d="m54 274 196-42 143 40v17l-197 49L54 289Z" fill="var(--p1)"/>
                  <path d="m54 274 142 45 197-47-143-40Z" fill="var(--p1)"/>
                  <path d="m54 274 142 45 197-47-143-40Z" fill="#fff" opacity=".26"/>
                  <path d="m196 319 197-47v17l-197 49Z" fill="#000" opacity=".12"/>
                  <path d="m54 274 142 45v19L54 289Z" fill="#000" opacity=".05"/>
                </g>
                <ellipse cx="275" cy="267" rx="73" ry="9" fill="#000" opacity=".12" filter="url(#contact-shadow)"/>
                <g class="sculpture-piece arch" data-material="1">
                  <path d="m319 260 17-8V127c0-43-25-67-62-67 28 7 45 33 45 69Z" fill="var(--p2)"/>
                  <path d="m319 260 17-8V127c0-43-25-67-62-67 28 7 45 33 45 69Z" fill="#000" opacity=".18"/>
                  <path d="M193 270V129a63 63 0 0 1 126 0v131l-34 5V129a29 29 0 0 0-58 0v141Z" fill="var(--p2)"/>
                  <path d="M193 270V129a63 63 0 0 1 126 0v131l-34 5V129a29 29 0 0 0-58 0v141Z" fill="url(#arch-light)"/>
                  <path d="m227 270 13-6V132c0-14 7-24 20-28-19-2-33 10-33 25Z" fill="var(--p2)"/>
                  <path d="m227 270 13-6V132c0-14 7-24 20-28-19-2-33 10-33 25Z" fill="#000" opacity=".12"/>
                </g>
                <ellipse cx="132" cy="272" rx="48" ry="8" fill="#000" opacity=".12" filter="url(#contact-shadow)"/>
                <g class="sculpture-piece cylinder" data-material="4">
                  <path d="M89 171h84v91c0 17-84 17-84 0Z" fill="var(--p5)"/>
                  <path d="M89 171h84v91c0 17-84 17-84 0Z" fill="url(#cylinder-light)"/>
                  <ellipse cx="131" cy="171" rx="42" ry="13" fill="var(--p5)"/>
                  <ellipse cx="131" cy="171" rx="42" ry="13" fill="#fff" opacity=".2"/>
                </g>
                <g class="sculpture-piece cube" data-material="2">
                  <path d="m139 244 49-15 49 23-49 17Z" fill="var(--p3)"/>
                  <path d="m139 244 49-15 49 23-49 17Z" fill="#fff" opacity=".22"/>
                  <path d="m139 244 49 25v48l-49-25Z" fill="var(--p3)"/>
                  <path d="m188 269 49-17v48l-49 17Z" fill="var(--p3)"/>
                  <path d="m188 269 49-17v48l-49 17Z" fill="url(#cube-light)"/>
                </g>
                <g class="sculpture-piece sphere" data-material="3">
                  <ellipse cx="300" cy="289" rx="36" ry="7" fill="#000" opacity=".19" filter="url(#contact-shadow)"/>
                  <circle cx="296" cy="251" r="39" fill="var(--p4)"/>
                  <circle cx="296" cy="251" r="39" fill="url(#sphere-light)"/>
                </g>
              </svg>
            </div>
            <div class="preview-view poster-view" data-view="poster" hidden>
              <div class="poster-top"><span>形色研究</span><span>No. 05</span></div>
              <div class="poster-title">form<br><em>& tone.</em></div>
              <div class="poster-art" aria-hidden="true">
                <span class="poster-disc" data-material="1"></span>
                <span class="poster-loop poster-loop-one" data-material="2"></span>
                <span class="poster-loop poster-loop-two" data-material="4"></span>
                <span class="poster-orb" data-material="3"></span>
              </div>
              <div class="poster-bottom"><span>Studies in colour</span><span>2026</span></div>
            </div>
            <div class="preview-view interface-view" data-view="interface" hidden>
              <div class="sample-ui">
                <div class="sample-header"><span class="sample-logo">forma.</span><button class="sample-like" id="sample-like" aria-label="收藏作品" aria-pressed="false"><i class="ti ti-heart" aria-hidden="true"></i></button></div>
                <div class="sample-nav" role="group" aria-label="作品分类"><button data-collection="object" aria-pressed="true">物件</button><button data-collection="print" aria-pressed="false">平面</button><span id="sample-number">01 / 02</span></div>
                <div class="sample-art" data-collection-view="object" aria-hidden="true">
                  <span class="sample-plinth" data-material="0"></span><span class="sample-lamp-stem" data-material="2"></span><span class="sample-lamp-shade" data-material="3"></span><span class="sample-vase" data-material="4"></span>
                </div>
                <div class="sample-art sample-print" data-collection-view="print" aria-hidden="true" hidden><span class="sample-print-disc" data-material="3"></span><span class="sample-print-band" data-material="2"></span><span class="sample-print-dot" data-material="4"></span></div>
                <div class="sample-copy"><h2 id="sample-title">曲线的日常</h2><span id="sample-category">Object study · 004</span></div>
                <button class="sample-cta" id="sample-next"><span>下一件作品</span><i class="ti ti-arrow-right" aria-hidden="true"></i></button>
              </div>
            </div>
          </div>
          <div class="preview-switch" role="group" aria-label="选择应用场景">
            <span class="preview-indicator" aria-hidden="true"></span>
            <button class="preview-tab is-active" data-preview="sculpture" aria-pressed="true"><i class="ti ti-cylinder" aria-hidden="true"></i>雕塑</button>
            <button class="preview-tab" data-preview="poster" aria-pressed="false"><i class="ti ti-layout-board" aria-hidden="true"></i>海报</button>
            <button class="preview-tab" data-preview="interface" aria-pressed="false"><i class="ti ti-browser" aria-hidden="true"></i>界面</button>
          </div>
        </section>
      </div>
      <div class="layer" id="dialog-layer" hidden>
        <div class="scrim" id="scrim"></div>
        <section class="dialog" id="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title" tabindex="-1">
          <header class="dialog-header"><h2 id="dialog-title"></h2><button class="icon-button" id="close-dialog" aria-label="关闭"><i class="ti ti-x" aria-hidden="true"></i></button></header>
          <div class="dialog-body" id="dialog-body"></div>
        </section>
      </div>
      <div class="toast" id="toast" role="status" aria-live="polite"><i class="ti ti-check" aria-hidden="true"></i><span></span></div>
      <div class="sr-only" id="live-region" aria-live="polite" aria-atomic="true"></div>
    </section>
  </main>
</body>
</html>
