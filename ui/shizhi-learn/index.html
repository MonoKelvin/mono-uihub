<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#f8faf4">
  <meta name="color-scheme" content="light">
  <meta name="description" content="拾知，把好奇心变成每天的一点新知识。">
  <title>拾知 · 给好奇心一点时间</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.49.0/dist/tabler-icons-300.min.css">
  <link rel="stylesheet" href="https://fontsapi.zeoseven.com/292/main/result.css">
  <link rel="stylesheet" href="./styles.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <div class="stage">
    <div class="device-frame">
    <div class="canvas" id="app">
      <div class="status-bar" aria-hidden="true">
        <span class="status-time">9:41</span>
        <div class="status-icons"><i class="ti ti-antenna-bars-5"></i><i class="ti ti-wifi"></i><span class="battery"><span></span></span></div>
      </div>
      <header class="app-header">
        <button class="wordmark" data-nav="home" aria-label="拾知首页"><span class="brand-mark"><i class="ti ti-seeding"></i></span>拾知<span class="wordmark-dot"></span></button>
        <div class="header-actions">
          <span class="streak"><i class="ti ti-flame"></i><span>连续 6 天</span></span>
          <button class="icon-button notification-button" data-action="notifications" aria-label="学习提醒"><i class="ti ti-bell"></i><span class="notification-dot" id="notification-dot"></span></button>
        </div>
      </header>
      <main class="app-main" id="main" tabindex="-1"></main>
      <nav class="bottom-nav" aria-label="主导航">
        <button class="nav-item active" data-nav="home" aria-current="page"><span class="nav-icon"><i class="ti ti-home"></i><svg class="nav-fill" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 9 7v11a2 2 0 0 1-2 2h-5v-8h-4v8H5a2 2 0 0 1-2-2V9z"/></svg></span><span>今天</span></button>
        <button class="nav-item" data-nav="discover"><span class="nav-icon"><i class="ti ti-compass"></i><svg class="nav-fill" viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm4.7 5.3-3.2 6.2-6.2 3.2 3.2-6.2 6.2-3.2Z"/></svg></span><span>探索</span></button>
        <button class="nav-item" data-nav="review"><span class="nav-icon"><i class="ti ti-cards"></i><svg class="nav-fill" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3h11a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2h-1V7a2 2 0 0 0-2-2H6a2 2 0 0 1 2-2Z"/><path d="M4 7h11a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1Z"/></svg></span><span>复习</span><span class="nav-badge" id="review-badge">5</span></button>
        <button class="nav-item" data-nav="profile"><span class="nav-icon"><i class="ti ti-user-circle"></i><svg class="nav-fill" viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm0 4a3 3 0 1 1 0 6 3 3 0 0 1 0-6Zm-5 12v-1a5 5 0 0 1 10 0v1a8 8 0 0 1-10 0Z"/></svg></span><span>我的</span></button>
      </nav>
      <div class="home-indicator" aria-hidden="true"></div>
      <div class="layer" id="layer" hidden>
        <button class="scrim" data-action="close-sheet" aria-label="关闭弹层"></button>
        <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1"></section>
      </div>
      <div class="reader" id="reader" hidden aria-label="课程学习">
        <header class="reader-header">
          <button class="icon-button" data-action="close-reader" aria-label="退出学习"><i class="ti ti-x"></i></button>
          <span id="reader-label">认知心理学</span>
          <div class="reader-tools">
            <button class="icon-button type-button" data-action="reading-size" id="reading-size" aria-label="放大阅读字号" aria-pressed="false">Aa</button>
            <button class="icon-button" data-action="reader-bookmark" id="reader-bookmark" aria-label="收藏课程" aria-pressed="false"></button>
          </div>
        </header>
        <div class="lesson-steps" id="lesson-steps" aria-label="学习步骤"></div>
        <div class="reader-content" id="reader-content" tabindex="-1"></div>
        <footer class="reader-footer" id="reader-footer"></footer>
      </div>
      <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    </div>
    </div>
  </div>
</body>
</html>
