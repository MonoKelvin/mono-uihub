<!DOCTYPE html>
<html lang="zh-CN" data-theme="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>格木 GEMU 全屋定制家居</title>
<meta name="description" content="格木 GEMU 全屋定制家居，设计师上门量房出图，自有工厂交付，平均 45 天完成整屋柜体。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://images.unsplash.com">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@300;400;500&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script>document.documentElement.classList.add('js');</script>
</head>
<body>

<!-- ============ 图标体系：内联 SVG sprite，24px 线性 1.5，圆角端点 ============ -->
<svg xmlns="http://www.w3.org/2000/svg" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
  <symbol id="i-diamond" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M12 4.5L19.5 12 12 19.5 4.5 12z"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h16"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.6M12 18.9v2.6M2.5 12h2.6M18.9 12h2.6M5 5l1.8 1.8M17.2 17.2L19 19M19 5l-1.8 1.8M6.8 17.2L5 19"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></symbol>
  <symbol id="i-arrow-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15"/><path d="M13.5 6.5l6 5.5-6 5.5"/></symbol>
  <symbol id="i-arrow-up-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17l10-10"/><path d="M9 7h8v8"/></symbol>
  <symbol id="i-arrow-up" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M6.5 10.5L12 5l5.5 5.5"/></symbol>
  <symbol id="i-quote" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M10 6.5c-2.6 1.5-4 3.9-4 7.1V18h5.5V11h-3.3c.1-2.1 1-3.7 2.6-4.7z"/><path d="M19.2 6.5c-2.6 1.5-4 3.9-4 7.1V18h5.5V11h-3.3c.1-2.1 1-3.7 2.6-4.7z"/></symbol>
  <symbol id="i-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.2L12 4.5l8 6.7V20H4z"/><path d="M10 20v-5h4v5"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M12 7.5V12l3 2"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.5c3.6-3.4 5.5-6.4 5.5-9a5.5 5.5 0 1 0-11 0c0 2.6 1.9 5.6 5.5 9z"/><circle cx="12" cy="11.3" r="1.9"/></symbol>
  <symbol id="i-ruler" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="8" width="17" height="8" rx="1"/><path d="M8 8v3M12 8v4M16 8v3"/></symbol>
  <symbol id="i-blueprint" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="1"/><path d="M3.5 9.5h17M9 9.5v10M9 14.5h6"/></symbol>
  <symbol id="i-truck" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 7.5h10v8h-10z"/><path d="M12.5 10.5h4l3 3v2h-7z"/><circle cx="6.5" cy="17.5" r="1.8"/><circle cx="16.5" cy="17.5" r="1.8"/></symbol>
  <symbol id="i-phone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3.5h3l1.5 4-2 1.5a11 11 0 0 0 5 5l1.5-2 4 1.5v3a2 2 0 0 1-2 2A16 16 0 0 1 5 5.5a2 2 0 0 1 2-2z"/></symbol>
  <symbol id="i-wardrobe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3.5" width="16" height="17" rx="1"/><path d="M12 3.5v17"/><path d="M9.6 11.5v2M14.4 11.5v2"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/></symbol>
  <symbol id="i-leaf" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 4c0 8-4.5 12-9 12a4 4 0 0 1 0-8c3 0 5-1.5 9-4z"/><path d="M4 20c2-6 6-9 10-11"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5l7 2.6v5.4c0 4.4-3 7.4-7 8.5-4-1.1-7-4.1-7-8.5V6.1z"/><path d="M9 11.8l2.2 2.2 3.8-4"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
</svg>

<div class="progress" aria-hidden="true"><i id="progress"></i></div>
<div class="cursor" id="cursor" aria-hidden="true"><span id="cursor-t">view</span></div>

<!-- ============ 导航 ============ -->
<header class="nav" id="nav">
  <div class="wrap nav-in">
    <a class="brand" href="#top" aria-label="格木 GEMU 首页">
      <span class="brand-cn">格木</span>
      <span class="brand-en">GEMU</span>
      <svg class="ic brand-orn" aria-hidden="true"><use href="#i-diamond"/></svg>
    </a>
    <nav class="nav-links" id="nav-links" aria-label="主导航"></nav>
    <div class="nav-act">
      <button class="icon-btn" id="theme-btn" type="button" aria-label="切换深浅主题" data-mag>
        <svg class="ic" aria-hidden="true"><use href="#i-moon" id="theme-use"/></svg>
      </button>
      <button class="icon-btn burger" id="burger" type="button" aria-label="展开导航" aria-expanded="false">
        <svg class="ic" aria-hidden="true"><use href="#i-menu" id="burger-use"/></svg>
      </button>
    </div>
  </div>
  <div class="drawer" id="drawer" hidden>
    <nav class="drawer-links" id="drawer-links" aria-label="移动端导航"></nav>
    <p class="drawer-meta" id="drawer-meta"></p>
  </div>
</header>

<main>
  <!-- ============ 首屏 ============ -->
  <section class="hero" id="top">
    <div class="wrap hero-in">
      <div class="hero-copy">
        <p class="hero-kicker" id="hero-kicker"></p>
        <p class="hero-latin" id="hero-latin"></p>
        <h1 class="hero-title" id="hero-title"></h1>
        <p class="hero-sub" id="hero-sub"></p>
      </div>
      <figure class="hero-fig">
        <span class="hero-frame imgz"><img id="hero-img" alt="" fetchpriority="high"></span>
        <figcaption class="hero-cap" id="hero-cap"></figcaption>
      </figure>
      <div class="hero-foot">
        <p class="hero-meta" id="hero-meta"></p>
      </div>
    </div>
    <span class="hero-outline" id="hero-outline" aria-hidden="true"></span>
  </section>

  <!-- ============ 作品：横向滚动画廊 ============ -->
  <section class="works" id="works">
    <div class="w-stage" id="w-stage">
      <header class="w-head">
        <div class="w-intro">
          <p class="w-label" id="w-label"></p>
          <p class="w-latin" id="w-latin"></p>
          <p class="w-lead" id="w-lead"></p>
        </div>
        <p class="w-count" id="w-count" aria-hidden="true"></p>
      </header>
      <div class="w-track" id="w-track"></div>
      <div class="w-prog" aria-hidden="true"><i id="w-prog-i"></i></div>
    </div>
  </section>

  <!-- ============ 服务：整幅酒红色块 ============ -->
  <section class="services" id="services">
    <div class="wrap">
      <div class="s-head">
        <p class="s-label" id="s-label"></p>
        <p class="s-latin" id="s-latin"></p>
        <p class="s-index" id="s-index"></p>
      </div>
      <p class="s-lead" id="s-lead"></p>
      <div class="s-list" id="s-list"></div>
    </div>
  </section>

  <!-- ============ 流程：三列并置 ============ -->
  <section class="flow" id="flow">
    <div class="wrap">
      <div class="f-head">
        <p class="f-label" id="f-label"></p>
        <p class="f-latin" id="f-latin"></p>
      </div>
      <p class="f-lead" id="f-lead"></p>
      <div class="fsteps" id="f-steps"></div>
      <figure class="fquote" id="f-quote"></figure>
    </div>
  </section>

  <!-- ============ 预约：整幅墨黑，两栏 ============ -->
  <section class="book" id="book">
    <div class="wrap book-in">
      <div class="b-left">
        <p class="b-kicker" id="b-kicker"></p>
        <p class="b-rsvp" id="b-rsvp" aria-hidden="true"></p>
        <h2 class="b-title" id="b-title"></h2>
        <p class="b-sub" id="b-sub"></p>
      </div>
      <div class="b-right">
        <div class="b-phone">
          <p class="b-phone-label" id="b-phone-label"></p>
          <p class="b-phone-no" id="b-phone-no"></p>
        </div>
        <button class="b-btn" id="b-btn" type="button" data-mag></button>
        <form class="b-form" id="b-form" hidden novalidate>
          <input id="b-input" type="tel" inputmode="numeric" autocomplete="tel" aria-label="手机号">
          <button class="b-submit" id="b-submit" type="submit"></button>
        </form>
        <p class="b-msg" id="b-msg" role="status"></p>
        <div class="b-ok" id="b-ok" hidden>
          <h3 class="b-ok-title" id="b-ok-title"></h3>
          <p class="b-ok-sub" id="b-ok-sub"></p>
          <button class="b-again" id="b-again" type="button"></button>
        </div>
        <p class="b-stores" id="b-stores"></p>
      </div>
    </div>
  </section>
</main>

<!-- ============ 页脚 ============ -->
<footer class="foot">
  <span class="foot-word" id="foot-word" aria-hidden="true"></span>
  <div class="wrap foot-in">
    <a class="foot-brand" href="#top">格木 GEMU</a>
    <nav class="foot-links" id="foot-links" aria-label="页脚导航"></nav>
    <p class="foot-copy">© 2026 格木家居定制</p>
    <button class="to-top" id="to-top" type="button" data-mag>
      回到顶部<svg class="ic" aria-hidden="true"><use href="#i-arrow-up"/></svg>
    </button>
  </div>
</footer>

<div class="peek" id="peek" aria-hidden="true"><img id="peek-img" alt=""></div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
