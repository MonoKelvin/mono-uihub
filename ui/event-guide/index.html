<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#333333">
  <title>Event Guide — Your next live moment</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.49.0/dist/tabler-icons-300.min.css">
  <link rel="stylesheet" href="./styles.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <svg class="svg-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
      <symbol id="sparkle" viewBox="0 0 40 40"><path d="M20 0C23 13 27 17 40 20C27 23 23 27 20 40C17 27 13 23 0 20C13 17 17 13 20 0Z" fill="currentColor"/></symbol>
      <symbol id="nav-home" viewBox="0 0 24 24"><path class="active-fill" d="M4 10L12 3L20 10V21H4Z"/><path d="M4 10L12 3L20 10V21H4Z"/></symbol>
      <symbol id="nav-map" viewBox="0 0 24 24"><path class="active-fill" d="M12 22S4 14 4 9A8 8 0 0 1 20 9C20 14 12 22 12 22Z"/><path d="M12 22S4 14 4 9A8 8 0 0 1 20 9C20 14 12 22 12 22Z"/><circle cx="12" cy="9" r="2.5"/></symbol>
      <symbol id="nav-ticket" viewBox="0 0 24 24"><path class="active-fill" d="M3 5H21V9A3 3 0 0 0 21 15V19H3V15A3 3 0 0 0 3 9Z"/><path d="M3 5H21V9A3 3 0 0 0 21 15V19H3V15A3 3 0 0 0 3 9Z"/></symbol>
      <symbol id="nav-profile" viewBox="0 0 24 24"><circle class="active-fill" cx="12" cy="7" r="4"/><circle cx="12" cy="7" r="4"/><path d="M4 21V19A8 8 0 0 1 20 19V21"/></symbol>
    </defs>
  </svg>
  <main class="presentation" aria-label="Event Guide">
    <section class="stage stage--cover" aria-label="Welcome">
      <article class="canvas" data-phone="cover" aria-label="Welcome screen">
        <div class="phone-content" data-view="welcome">
          <section class="welcome-view">
            <svg class="welcome-art" viewBox="0 0 314 681" fill="none" aria-hidden="true">
              <defs><radialGradient id="ray-fade" cx="0" cy="0.438" r="0.88" gradientUnits="objectBoundingBox"><stop stop-color="var(--line)"/><stop offset="1" stop-color="#090909"/></radialGradient></defs>
              <g stroke="url(#ray-fade)" stroke-width=".7">
                <path d="M0 298L8 0M0 298L53 0M0 298L99 0M0 298L154 0M0 298L220 0M0 298L314 22M0 298L314 104M0 298L314 163M0 298L314 212M0 298L314 255M0 298L314 298M0 298L314 341M0 298L314 384M0 298L314 433M0 298L314 492M0 298L314 574M0 298L274 681M0 298L190 681M0 298L120 681M0 298L63 681M0 298L15 681"/>
              </g>
              <path d="M104 59L127 87L150 59L173 87L197 59L220 87" stroke="#e6e6e6" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M88 239L169 159" stroke="var(--poster)" stroke-width="27" stroke-linecap="round"/>
              <path d="M37 132C40 142 43 146 53 148C43 150 40 155 37 165C35 155 31 150 21 148C31 146 35 142 37 132Z" fill="var(--brand)"/>
              <path d="M254 162C260 186 267 193 291 199C267 205 260 212 254 236C248 212 241 205 217 199C241 193 248 186 254 162Z" fill="var(--brand)"/>
              <circle cx="178" cy="300" r="23" fill="#e5e5e5"/>
            </svg>
            <h1 class="welcome-heading"><span>Your<br>Event</span><span class="welcome-heading-end">Guide<br>2022</span></h1>
            <button class="primary-button discover-button" data-action="discover"><span>Discover</span><i class="ti ti-arrow-up-right" aria-hidden="true"></i><svg class="edge-grain" viewBox="0 0 272 28" aria-hidden="true"><defs><filter id="cover-grain"><feTurbulence type="fractalNoise" baseFrequency=".82" numOctaves="3" seed="8"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".45"/></feComponentTransfer></filter><linearGradient id="grain-fade" x2="0" y2="1"><stop stop-color="white" stop-opacity="0"/><stop offset="1" stop-color="white"/></linearGradient><mask id="grain-mask"><rect width="272" height="28" fill="url(#grain-fade)"/></mask></defs><rect width="272" height="28" filter="url(#cover-grain)" mask="url(#grain-mask)"/></svg></button>
          </section>
        </div>
        <div class="layer" hidden></div>
        <div class="toast" role="status" aria-live="polite"></div>
      </article>
    </section>
    <section class="stage stage--middle" aria-label="Discover events">
      <article class="canvas" data-phone="events" aria-label="Events screen">
        <div class="phone-content" data-view="home"></div>
        <div class="layer" hidden></div>
        <div class="toast" role="status" aria-live="polite"></div>
      </article>
    </section>
    <section class="stage stage--tickets" aria-label="Your tickets">
      <article class="canvas" data-phone="tickets" aria-label="Tickets screen">
        <div class="phone-content" data-view="tickets"></div>
        <div class="layer" hidden></div>
        <div class="toast" role="status" aria-live="polite"></div>
      </article>
    </section>
  </main>
  <template id="home-template">
    <section class="app-view home-view">
      <header class="app-header"><h2>Hello <span class="heading-sparkles" aria-hidden="true"><svg><use href="#sparkle"/></svg><svg><use href="#sparkle"/></svg></span></h2><button class="icon-button menu-trigger" data-action="menu" aria-label="Open menu" aria-expanded="false"><i class="ti ti-menu" aria-hidden="true"></i></button></header>
      <form class="search-form" role="search"><input type="search" name="search" placeholder="Search events" aria-label="Search events" autocomplete="off" maxlength="100"><button class="search-button" type="submit" aria-label="Search"><i class="ti ti-search" aria-hidden="true"></i></button></form>
      <div class="date-heading"><span>15.09</span><span>Mon</span></div>
      <div class="event-results" aria-live="polite"></div>
      <nav class="bottom-nav" aria-label="Main navigation"></nav>
    </section>
  </template>
  <template id="tickets-template">
    <section class="app-view tickets-view">
      <header class="app-header"><h2>Tickets <span class="heading-sparkles" aria-hidden="true"><svg><use href="#sparkle"/></svg><svg><use href="#sparkle"/></svg></span></h2><button class="icon-button menu-trigger" data-action="menu" aria-label="Open menu" aria-expanded="false"><i class="ti ti-menu" aria-hidden="true"></i></button></header>
      <div class="ticket-carousel" aria-live="polite"></div>
      <div class="ticket-pagination" aria-label="Choose a ticket"></div>
      <nav class="bottom-nav" aria-label="Main navigation"></nav>
    </section>
  </template>
  <template id="locations-template">
    <section class="app-view locations-view">
      <header class="app-header"><h2>Places <span class="heading-sparkles" aria-hidden="true"><svg><use href="#sparkle"/></svg><svg><use href="#sparkle"/></svg></span></h2><button class="icon-button menu-trigger" data-action="menu" aria-label="Open menu" aria-expanded="false"><i class="ti ti-menu" aria-hidden="true"></i></button></header>
      <div class="location-map" aria-label="Concert locations in Europe"><svg viewBox="0 0 272 240" aria-hidden="true"><g fill="none" stroke="var(--map-line)" stroke-width="1.3"><path d="M-10 45L75 93L272 15M5 190L126 116L283 185M53-10L86 240M189-10L143 240M-5 119L280 93M-10 220L283 200M113-5L195 245M10 15L267 237"/><path d="M14 30L53 16L105 39L112 94L94 119L125 166L114 206L53 216L28 182L38 126L12 85Z"/></g></svg><button class="map-pin map-pin--madrid is-selected" data-action="location" data-city="Madrid" aria-label="Madrid events" aria-pressed="true"><i class="ti ti-map-pin" aria-hidden="true"></i></button><button class="map-pin map-pin--london" data-action="location" data-city="London" aria-label="London events" aria-pressed="false"><i class="ti ti-map-pin" aria-hidden="true"></i></button><button class="map-pin map-pin--malahide" data-action="location" data-city="Malahide" aria-label="Malahide events" aria-pressed="false"><i class="ti ti-map-pin" aria-hidden="true"></i></button></div>
      <h3 class="section-title" data-location-title>Madrid, Spain</h3><div class="location-events"></div>
      <nav class="bottom-nav" aria-label="Main navigation"></nav>
    </section>
  </template>
  <template id="profile-template">
    <section class="app-view profile-view">
      <header class="app-header"><h2>You <span class="heading-sparkles" aria-hidden="true"><svg><use href="#sparkle"/></svg><svg><use href="#sparkle"/></svg></span></h2><button class="icon-button menu-trigger" data-action="menu" aria-label="Open menu" aria-expanded="false"><i class="ti ti-menu" aria-hidden="true"></i></button></header>
      <div class="profile-avatar" aria-hidden="true">A</div><h3 class="profile-name">Alex Morgan</h3><p class="profile-caption">Here for the live moments.</p>
      <div class="profile-tabs" aria-label="Your events"><button class="profile-tab is-selected" data-action="profile-tab" data-tab="saved" aria-pressed="true">Saved events</button><button class="profile-tab" data-action="profile-tab" data-tab="tickets" aria-pressed="false">My tickets <span>3</span></button></div>
      <div class="profile-events" aria-live="polite"></div>
      <nav class="bottom-nav" aria-label="Main navigation"></nav>
    </section>
  </template>
</body>
</html>
