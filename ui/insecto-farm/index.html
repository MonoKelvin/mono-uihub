<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#143407">
  <title>Insecto — a little closer to your land</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;450;500;550;600;650;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.49.0/dist/tabler-icons-300.min.css">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="stage">
    <div class="canvas" aria-label="Insecto farm management">
      <svg class="symbol-bank" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <symbol id="icon-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10H3Z"/><path d="M9 20v-7h6v7"/></symbol>
        <symbol id="icon-leaf" viewBox="0 0 24 24"><path d="M5 17C-1 6 10 2 21 3c1 12-5 20-14 14Z"/><path d="M3 22 16 9"/></symbol>
        <symbol id="icon-robot" viewBox="0 0 24 24"><rect x="5" y="7" width="14" height="14" rx="4"/><path d="M12 3v4M2 12v5M22 12v5M9 12h.01M15 12h.01M9 17h6"/></symbol>
        <symbol id="icon-chart" viewBox="0 0 24 24"><path d="M10 3a9 9 0 1 0 11 11H10Z"/><path d="M14 2v8h8a9 9 0 0 0-8-8Z"/></symbol>
        <symbol id="icon-folder" viewBox="0 0 24 24"><path d="M3 20V5a2 2 0 0 1 2-2h5l2 4h7a2 2 0 0 1 2 2v11Z"/></symbol>
        <symbol id="icon-bell" viewBox="0 0 24 24"><path d="M4 17h16l-2-4V9a6 6 0 0 0-12 0v4Z"/><path d="M9 21h6"/></symbol>
        <symbol id="icon-settings" viewBox="0 0 24 24"><path d="m10 2-1 3-3 1-3-1-2 4 3 2v3l-3 2 2 4 3-1 3 1 1 3h4l1-3 3-1 3 1 2-4-3-2v-3l3-2-2-4-3 1-3-1-1-3Z"/><circle cx="12" cy="12" r="3"/></symbol>
      </svg>
      <aside class="rail" aria-label="Main navigation">
        <a class="brand" href="#overview" aria-label="Insecto home" data-nav="overview">
          <svg viewBox="0 0 48 52" aria-hidden="true"><path fill="currentColor" d="M2 21c19 0 30 12 30 29h-9C23 38 15 30 2 30Zm0 17c8 0 12 4 12 12H2ZM26 3c-9 12-7 20 0 23 6-7 7-14 0-23Zm-1 26c10-9 17-9 23-4-7 8-15 10-23 4Z"/></svg>
        </a>
        <nav class="primary-nav">
          <button class="nav-button is-active" data-nav="overview" aria-label="Production overview" title="Production overview"><svg><use href="#icon-home"/></svg><span class="nav-label">Overview</span></button>
          <button class="nav-button" data-nav="fields" aria-label="Fields & operations" title="Fields & operations"><svg><use href="#icon-leaf"/></svg><span class="nav-label">Fields</span></button>
          <button class="nav-button" data-nav="agronomy" aria-label="Agronomy workspace" title="Agronomy workspace"><svg><use href="#icon-robot"/></svg><span class="nav-label">Agronomy</span></button>
          <button class="nav-button" data-nav="analytics" aria-label="Crop analytics" title="Crop analytics"><svg><use href="#icon-chart"/></svg><span class="nav-label">Analytics</span></button>
          <button class="nav-button" data-nav="documents" aria-label="Documents" title="Documents"><svg><use href="#icon-folder"/></svg><span class="nav-label">Documents</span></button>
          <button class="nav-button" data-nav="notifications" aria-label="Notifications" title="Notifications"><svg><use href="#icon-bell"/></svg><span class="unread-dot"></span><span class="nav-label">Notifications</span></button>
        </nav>
        <div class="rail-bottom">
          <button class="nav-button" data-nav="settings" aria-label="Farm settings" title="Farm settings"><svg><use href="#icon-settings"/></svg><span class="nav-label">Settings</span></button>
          <button class="avatar-button" data-nav="settings" aria-label="Profile of Eleanor Reed" title="Eleanor Reed · Farm manager"><span>ER</span></button>
        </div>
      </aside>
      <main class="workspace" id="workspace" tabindex="-1"></main>
      <aside class="agronomist" aria-label="AI agronomist">
        <header class="assistant-header">
          <button class="icon-button light assistant-back" data-action="close-assistant" aria-label="Back to workspace"><i class="ti ti-arrow-left" aria-hidden="true"></i></button>
          <h2><i class="ti ti-robot" aria-hidden="true"></i> AI agronomist</h2>
          <div class="dropdown assistant-menu">
            <button class="icon-button light" data-menu="assistant-menu" aria-label="Agronomist options" aria-expanded="false"><i class="ti ti-dots" aria-hidden="true"></i></button>
            <div class="dropdown-panel" id="assistant-menu" role="menu" hidden>
              <button role="menuitem" data-nav="agronomy">Open workspace <i class="ti ti-arrow-up-right"></i></button>
              <button role="menuitem" data-action="clear-chat">New conversation <i class="ti ti-message-plus"></i></button>
              <button role="menuitem" data-action="export-chat">Export conversation <i class="ti ti-download"></i></button>
            </div>
          </div>
        </header>
        <div class="assistant-content">
          <div class="assistant-intro">
            <h3>Monitoring systems active!</h3>
            <p>Satellite and sensor snapshot. Tracking <span id="zone-count">24</span> production zones across 3 sectors.</p>
            <p>What would you like to analyze?</p>
          </div>
          <div class="conversation" id="conversation" aria-live="polite"></div>
          <section class="recovery-chart" aria-label="Yield efficiency trend from January to April">
            <svg viewBox="0 0 400 125" preserveAspectRatio="none" aria-hidden="true"><path class="recovery-path" d="M16 93 66 71 160 94 252 36 347 11 388 7"/><circle cx="66" cy="71" r="3.5"/><circle cx="160" cy="94" r="3.5"/><circle class="current-point" cx="252" cy="36" r="7"/><circle cx="347" cy="11" r="3.5"/></svg>
            <div class="trend-points" id="trend-points">
              <button data-trend="0" aria-label="January: 42% efficiency, stable"><span>Stable</span><small>Jan</small></button>
              <button data-trend="1" aria-label="February: 35% efficiency, decline"><span>Decline</span><small>Feb</small></button>
              <button class="is-active" data-trend="2" aria-label="March: 65% efficiency, recovery"><span>Recovery</span><small>Mar</small></button>
              <button data-trend="3" aria-label="April: 73% forecast efficiency, growth"><span>Growth</span><small>Apr</small></button>
            </div>
            <span class="trend-readout" id="trend-readout" hidden></span>
          </section>
          <div class="conversation-pager" id="conversation-pager" hidden></div>
        </div>
        <div class="assistant-bottom">
          <div class="quick-actions" aria-label="Agronomist quick actions">
            <button data-action="analyze">Run analysis</button>
            <button data-action="view-report">View report</button>
            <button data-action="optimize">Optimize yield</button>
            <button data-action="export-data">Export data</button>
          </div>
          <form class="composer" id="chat-form">
            <label class="sr-only" for="chat-input">Ask your agronomist</label>
            <textarea id="chat-input" maxlength="180" rows="2" placeholder="Ask me anything..."></textarea>
            <div class="composer-footer">
              <button type="button" class="attachment-button" data-action="attach"><i class="ti ti-paperclip" aria-hidden="true"></i><span id="attachment-label">Attachment</span></button>
              <button type="submit" class="send-button" aria-label="Send message"><i class="ti ti-send-2" aria-hidden="true"></i></button>
            </div>
            <span class="composer-error" id="composer-error" role="status" hidden></span>
          </form>
        </div>
      </aside>
      <div class="toast" id="toast" role="status" hidden><i class="ti ti-check" aria-hidden="true"></i><span></span><button class="icon-button" data-action="hide-toast" aria-label="Dismiss notification"><i class="ti ti-x"></i></button></div>
      <input type="file" id="file-input" accept=".csv,.json,.txt" hidden>
    </div>
  </div>
</body>
</html>
