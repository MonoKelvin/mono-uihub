<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#b9d5d9">
  <title>Stylist A.I. — Your personal edit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.49.0/dist/tabler-icons-300.min.css">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="stage">
    <div class="canvas" id="canvas">
      <aside class="sidebar" aria-label="Main navigation">
        <button class="brand-mark" data-view="shop" aria-label="Stylist A.I. home">
          <svg viewBox="0 0 36 36" aria-hidden="true"><g fill="currentColor"><path d="M2 2h7v7H2zM13 2h6v7h-6zM24 2h9v7h-9zM2 13h7v7H2zM13 13h7v7h-7zM25 14h8v7h-8zM2 25h7v8H2zM14 25h7v8h-7zM25 25h8v8h-8z"/><path d="M5 6h4c0 9 5 11 11 11v5C10 22 5 17 5 6zm11 0h4c0 8 4 10 10 10v5C20 21 16 15 16 6zM5 18h4c0 8 4 11 11 11v4C10 33 5 29 5 18z"/></g></svg>
        </button>
        <nav class="nav-items">
          <button class="nav-button" data-view="discover" aria-label="For you" title="For you"><i class="ti ti-bolt" aria-hidden="true"></i><svg class="active-symbol" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M13 2 4 14h7l-1 8 10-13h-7l1-7Z"/></svg></button>
          <button class="nav-button is-active" data-view="shop" aria-label="Shop" title="Shop" aria-current="page"><i class="ti ti-shirt" aria-hidden="true"></i><svg class="active-symbol" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="m8 3-6 3 3 5 3-1v11h8V10l3 1 3-5-6-3a4 4 0 0 1-8 0Z"/></svg></button>
          <button class="nav-button" data-view="accessories" aria-label="Accessories" title="Accessories"><i class="ti ti-sock" aria-hidden="true"></i><svg class="active-symbol" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2h9v12a5 5 0 0 1-2 4l-6 4a5 5 0 0 1-6-8l5-4V2Zm2 2v3h5V4Z"/></svg></button>
          <button class="nav-button" data-view="wishlist" aria-label="Wishlist" title="Wishlist"><i class="ti ti-heart" aria-hidden="true"></i><svg class="active-symbol" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 21C10 19 2 14 2 8a5.5 5.5 0 0 1 10-3 5.5 5.5 0 0 1 10 3c0 6-8 11-10 13Z"/></svg></button>
          <button class="nav-button" data-view="settings" aria-label="Settings" title="Settings"><i class="ti ti-settings" aria-hidden="true"></i><svg class="active-symbol" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="m10 2-1 3-2 1-3-1-2 4 2 2v2l-2 2 2 4 3-1 2 1 1 3h4l1-3 2-1 3 1 2-4-2-2v-2l2-2-2-4-3 1-2-1-1-3h-4Zm2 7a3 3 0 1 0 0 6 3 3 0 0 0 0-6Z"/></svg></button>
        </nav>
        <button class="profile-button" data-view="account" aria-label="Your account" title="Your account"><img src="assets/avatar.jpg" alt=""></button>
      </aside>
      <header class="topbar">
        <h1 class="breadcrumb"><button data-view="catalog">Shop</button><i class="ti ti-chevron-right" aria-hidden="true"></i><span id="view-title">Stylist A.I.</span></h1>
        <form class="search-form" id="search-form" role="search">
          <i class="ti ti-search" aria-hidden="true"></i>
          <input type="search" id="search" aria-label="Search clothes and accessories" placeholder="Search something..." autocomplete="off" maxlength="72">
        </form>
        <div class="header-actions">
          <button class="icon-button exit-button" id="account-button" data-view="account" aria-label="Account and sign out" title="Account"><i class="ti ti-logout" aria-hidden="true"></i></button>
          <button class="icon-button bag-button" data-view="bag" aria-label="Shopping bag, 2 items" title="Shopping bag"><i class="ti ti-shopping-bag" aria-hidden="true"></i><span class="bag-count" id="bag-count">2</span></button>
        </div>
      </header>
      <main class="workspace" id="workspace" aria-label="Shop"></main>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </div>
  </div>
</body>
</html>
