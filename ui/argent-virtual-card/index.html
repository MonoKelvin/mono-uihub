              <div class="owner">
                <span class="owner-name">YUN LIN</span>
                <span class="card-ending" aria-label="卡号末四位 2846"><span aria-hidden="true">••••</span> 2846</span>

            </svg>
                <span class="wordmark">argent</span>
              </div>
              <span class="back-category">虚拟借记卡</span>
            </header>

                                                <svg class="back-geometry" viewBox="0 -50 696 600" fill="none" preserveAspectRatio="xMinYMin slice" aria-hidden="true">
              <defs>
                <linearGradient id="back-curve-silver" x1="0" y1="0" x2="1" y2="0">
                  <stop stop-color="#7c8d81" stop-opacity=".10"/>
                  <stop offset=".22" stop-color="#e2e9e0" stop-opacity=".76"/>
                  <stop offset=".44" stop-color="#8fa095" stop-opacity=".32"/>
                  <stop offset=".62" stop-color="#c2cec4" stop-opacity=".50"/>
                  <stop offset=".82" stop-color="#eef2ec" stop-opacity=".68"/>
                  <stop offset="1" stop-color="#76887c" stop-opacity=".10"/>
                </linearGradient>
                <!-- Position-based fade: keeps the left-middle entries fully visible and
                     washes the tails out as they reach the lower-right of the card. -->
                <linearGradient id="back-fade-grad" x1="200" y1="-50" x2="660" y2="389" gradientUnits="userSpaceOnUse">
                  <stop offset="0" stop-color="#fff"/>
                  <stop offset=".4" stop-color="#fff"/>
                  <stop offset="1" stop-color="#000"/>
                </linearGradient>
                <mask id="back-fade" maskUnits="userSpaceOnUse" x="-60" y="-100" width="900" height="720">
                  <rect x="-60" y="-100" width="900" height="720" fill="url(#back-fade-grad)"/>
                </mask>
              </defs>
              <!-- Back wave field: exact reproduction of temp/curve.txt algorithm
                   (position=0.5, frozen static). Group transform stretches the field
                   1.35x horizontally and lifts it 125 units, so each curve enters at
                   the left-middle band and its tail sweeps down into the lower-right
                   of the card. stroke-dasharray is jittered per curve (52..92 of 100)
                   so the tails end at clearly varied lengths. -->
              <g mask="url(#back-fade)">
                <g stroke-linecap="round" stroke-linejoin="round" transform="translate(0 -125) scale(1.35 1)">
