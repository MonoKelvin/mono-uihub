<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>闻层 · 声纹地层档案馆</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.49.0/dist/tabler-icons.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spline+Sans+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css">
</head>
<body>

<div class="app-window" id="appWindow">

  <!-- ═══ 顶栏 ═══ -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-glyph" aria-hidden="true">
        <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <path d="M3 6.5 h16"/><path d="M3 11 h16"/><path d="M3 15.5 h16"/>
          <path d="M6.5 4.5 v4 M15 9 v4 M9.5 13.5 v4" stroke-width="2.2"/>
        </svg>
      </span>
      <div class="brand-text">
        <strong>闻层</strong>
        <small>Sonic Strata · 声学考古台</small>
      </div>
    </div>

    <div class="survey-readout" id="surveyReadout">
      <span class="readout-dot" aria-hidden="true"></span>
      <div class="readout-text">
        <strong id="readoutStratum">勘测中 · 第 Ⅲ 层 磁带纪</strong>
        <small id="readoutAge">1935 – 1972 年代带</small>
      </div>
    </div>

    <div class="topbar-meta">
      <span class="meta-chip mono">JX-KQ-04 探方</span>
      <span class="meta-chip mono" id="clockChip">14:32</span>
      <button class="icon-button" id="helpBtn" aria-label="使用说明"><i class="ti ti-help"></i></button>
    </div>
  </header>

  <!-- ═══ 主区 ═══ -->
  <div class="main">

    <!-- 左列 · 考古现场 -->
    <section class="dig-col" aria-label="考古现场">

      <div class="panel strata-panel">
        <div class="panel-head">
          <h2>考古现场 · 地层剖面</h2>
          <span class="head-meta mono">埋深 0–12.6 m</span>
        </div>
        <div class="strata-viewport" id="strataViewport">
          <canvas id="strataCanvas"></canvas>
          <button class="stratum-pill" id="stratumPill" aria-label="切换到当前地层">
            <span class="pill-no mono" id="pillNo">Ⅲ</span>
            <span class="pill-body"><strong id="pillName">磁带层</strong><small class="mono" id="pillYears">1935–1972</small></span>
            <i class="ti ti-arrows-sort-vertical" aria-hidden="true"></i>
          </button>
          <div class="drag-hint" id="dragHint"><i class="ti ti-hand-move" aria-hidden="true"></i>拖动地层剖面，垂直穿越年代</div>
        </div>
      </div>

      <div class="stratum-legend" id="stratumLegend" role="tablist" aria-label="地层快速定位">
        <!-- JS 渲染 -->
      </div>

      <div class="panel specimen-panel">
        <div class="panel-head">
          <h2>声音化石标本</h2>
          <span class="head-meta mono" id="specimenCount">6 件</span>
        </div>
        <div class="specimen-list" id="specimenList" role="list">
          <!-- JS 渲染 -->
        </div>
      </div>
    </section>

    <!-- 右列 · 分析台 -->
    <section class="lab-col" aria-label="分析台">

      <div class="lab-top">

        <div class="panel spectrum-panel">
          <div class="panel-head">
            <h2>频谱分析仪</h2>
            <span class="head-meta mono" id="spectrumReadout">悬停查看频点</span>
          </div>
          <div class="spectrum-body">
            <div class="spectrum-plot">
              <canvas id="spectrumCanvas"></canvas>
              <div class="spec-tag" id="specTag">
                <span class="mono" id="specTagNo">AC-1953-Ⅲ-07</span>
                <strong id="specTagName">中波电台整点报时</strong>
              </div>
            </div>

            <!-- 化石展开详情 -->
            <div class="fossil-detail" id="fossilDetail" hidden>
              <div class="detail-head">
                <div class="detail-title">
                  <strong id="detailName">中波电台整点报时</strong>
                  <span class="status-chip" id="detailStatus"><span class="status-dot good"></span>固结完好</span>
                </div>
                <button class="text-button" id="collapseBtn"><i class="ti ti-chevron-up"></i>收起</button>
              </div>
              <p class="detail-desc" id="detailDesc"></p>
              <dl class="detail-meta" id="detailMeta"></dl>
              <div class="detail-actions">
                <button class="primary-button" id="loadBtn"><i class="ti ti-wave-sine"></i>载入分析台</button>
                <button class="secondary-button" id="pinBtn"><i class="ti ti-droplet"></i>标记待注固</button>
              </div>
            </div>
          </div>
        </div>

        <aside class="panel log-panel">
          <div class="panel-head">
            <h2>地层大事记</h2>
            <span class="head-meta mono" id="logYear">1972</span>
          </div>
          <div class="log-list" id="logList">
            <!-- JS 渲染 -->
          </div>
        </aside>
      </div>

      <!-- 声音重建播放台 -->
      <div class="bench panel">
        <div class="bench-transport">
          <button class="play-button" id="playBtn" aria-label="播放重建声音">
            <i class="ti ti-player-play-filled" id="playIcon"></i>
          </button>
          <div class="scrub-block">
            <div class="scrub-bar" id="scrubBar" role="slider" aria-label="播放进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
              <div class="scrub-fill" id="scrubFill"></div>
              <div class="scrub-knob" id="scrubKnob"></div>
            </div>
            <div class="scrub-time mono"><span id="timeNow">00:00</span><span id="timeTotal">03:42</span></div>
          </div>
          <div class="vol-block">
            <i class="ti ti-volume-2" aria-hidden="true"></i>
            <input type="range" id="volSlider" min="0" max="100" value="62" aria-label="监听音量">
          </div>
        </div>

        <div class="bench-params" id="benchParams">
          <div class="param">
            <div class="param-head"><label for="pCutoff">带通滤波</label><span class="mono" id="vCutoff">2.4 kHz</span></div>
            <input type="range" id="pCutoff" min="0" max="100" value="52">
          </div>
          <div class="param">
            <div class="param-head"><label for="pStretch">时间伸缩</label><span class="mono" id="vStretch">×1.00</span></div>
            <input type="range" id="pStretch" min="0" max="100" value="50">
          </div>
          <div class="param">
            <div class="param-head"><label for="pGain">频谱增益</label><span class="mono" id="vGain">+0.0 dB</span></div>
            <input type="range" id="pGain" min="0" max="100" value="50">
          </div>
        </div>

        <div class="bench-export">
          <div class="export-status">
            <span class="status-dot warning" aria-hidden="true"></span>
            <div><strong>重建切片未导出</strong><small>当前参数尚未存入出站队列</small></div>
          </div>
          <button class="secondary-button" id="exportBtn"><i class="ti ti-package"></i>存入出站队列</button>
        </div>
      </div>
    </section>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<script src="./app.js"></script>
</body>
</html>
