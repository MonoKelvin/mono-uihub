<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080a0b">
  <title>Lumora Studio — Create your next scene</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;450;500;550;600;650&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.49.0/dist/tabler-icons-300.min.css">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="stage">
    <div class="canvas" id="studio" aria-label="Lumora Studio workspace">
      <div class="ambient" aria-hidden="true"><span class="ambient-figure"></span></div>
      <div class="app-layout">
      <aside class="sidebar" aria-label="Main navigation">
        <button class="workspace-switch" data-action="workspace-menu" aria-expanded="false" aria-haspopup="menu">
          <span class="brand-mark" aria-hidden="true"><span></span></span>
          <span class="workspace-copy"><strong>Lumora Studio</strong><span>Pro workspace</span></span>
          <i class="ti ti-chevron-down" aria-hidden="true"></i>
        </button>
        <label class="sidebar-search" for="workspace-search">
          <i class="ti ti-search" aria-hidden="true"></i>
          <input id="workspace-search" type="search" placeholder="Search" autocomplete="off" aria-label="Search projects and media">
          <kbd>/</kbd>
        </label>
        <button class="new-project button-light" data-nav="new"><span>New project</span><i class="ti ti-plus" aria-hidden="true"></i></button>
        <nav class="nav-groups">
          <div class="nav-group">
            <p class="nav-heading">Create</p>
            <button class="nav-item is-active" data-nav="home" aria-current="page"><i class="ti ti-home" aria-hidden="true"></i><span>Home</span></button>
            <button class="nav-item" data-nav="generate"><i class="ti ti-sparkles" aria-hidden="true"></i><span>Generate</span></button>
            <button class="nav-item" data-nav="flow"><i class="ti ti-route" aria-hidden="true"></i><span>Flow editor</span></button>
            <button class="nav-item" data-nav="queue"><i class="ti ti-clock" aria-hidden="true"></i><span>Render queue</span><span class="nav-count" id="queue-count">3</span></button>
          </div>
          <div class="nav-group">
            <p class="nav-heading">Library</p>
            <button class="nav-item" data-nav="projects"><i class="ti ti-folder" aria-hidden="true"></i><span>Projects</span></button>
            <button class="nav-item" data-nav="media"><i class="ti ti-photo" aria-hidden="true"></i><span>Media library</span></button>
            <button class="nav-item" data-nav="avatars"><i class="ti ti-user" aria-hidden="true"></i><span>AI avatars</span></button>
            <button class="nav-item" data-nav="templates"><i class="ti ti-layout-grid" aria-hidden="true"></i><span>Templates</span></button>
          </div>
          <div class="nav-group">
            <div class="nav-heading-row"><p class="nav-heading">Collections</p><button class="tiny-button" data-action="new-collection" aria-label="Create collection"><i class="ti ti-plus" aria-hidden="true"></i></button></div>
            <div id="collections-nav">
              <button class="nav-item collection-item" data-collection="brand"><span class="collection-dot dot-orange"></span><span>Brand films</span></button>
              <button class="nav-item collection-item" data-collection="nori"><span class="collection-dot dot-violet"></span><span>Nori campaign</span></button>
              <button class="nav-item collection-item" data-collection="shorts"><span class="collection-dot dot-green"></span><span>Shorts & reels</span></button>
            </div>
          </div>
          <div class="nav-group recent-nav">
            <p class="nav-heading">Recent</p>
            <button class="nav-item" data-project="dune"><img src="assets/dune-walker.webp" alt="" class="recent-thumb"><span>Dune Walker</span><time>2m</time></button>
            <button class="nav-item" data-project="amber"><img src="assets/perfume-reveal.webp" alt="" class="recent-thumb"><span>Amber Silk</span><time>2h</time></button>
          </div>
        </nav>
        <div class="sidebar-footer">
          <button class="plan-teaser" data-action="billing"><span><strong>Pro plan</strong><b>Upgrade</b></span><p>Unlock 8K export & priority renders</p></button>
          <button class="nav-item" data-nav="settings"><i class="ti ti-settings" aria-hidden="true"></i><span>Settings</span></button>
          <button class="nav-item" data-nav="help"><i class="ti ti-message-circle" aria-hidden="true"></i><span>Help center</span></button>
          <button class="account-button" data-action="account"><img src="assets/avatar-imran.webp" alt="Imran Hossen"><span><strong id="account-name">Imran Hossen</strong><span>Product designer</span></span><i class="ti ti-dots" aria-hidden="true"></i></button>
        </div>
      </aside>
      <main class="workspace">
        <header class="topbar">
          <div class="breadcrumb"><button data-nav="home" id="breadcrumb-main">Home</button><span>/</span><span id="breadcrumb-sub">Overview</span></div>
          <div class="topbar-actions">
            <button class="credit-button" data-nav="usage" aria-label="View usage: 2,450 credits"><i class="ti ti-bolt" aria-hidden="true"></i><span>2,450</span></button>
            <button class="icon-button" data-action="search" aria-label="Search"><i class="ti ti-search" aria-hidden="true"></i></button>
            <button class="icon-button notification-button" data-nav="activity" aria-label="Notifications and team activity"><i class="ti ti-bell" aria-hidden="true"></i><span class="notification-dot"></span></button>
          </div>
        </header>
        <div class="view-root" id="view-root"></div>
      </main>
      </div>
      <div class="popup-menu" id="popup-menu" role="menu" hidden></div>
      <div class="dialog-layer" id="dialog-layer" hidden>
        <div class="scrim" data-action="close-dialog"></div>
        <section class="dialog" id="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title" tabindex="-1"></section>
      </div>
      <div class="toast" id="toast" role="status" aria-live="polite" hidden><i class="ti ti-check" aria-hidden="true"></i><span></span><button data-action="close-toast" aria-label="Dismiss notification"><i class="ti ti-x" aria-hidden="true"></i></button></div>
      <input type="file" id="file-input" accept="image/*,video/*,audio/*,.json" hidden>
    </div>
  </div>
</body>
</html>
