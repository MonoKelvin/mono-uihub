<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>量界 · 物理爱好者交流社区</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/public-sans@5/latin.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5/chinese-simplified.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/dm-mono@5/latin.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.49.0/dist/tabler-icons-300.min.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="shell">

  <!-- ══════════════════════════════ 顶栏 ══════════════════════════════ -->
  <header class="bar">
    <a class="brand" href="#" data-nav="home">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
          <ellipse cx="12" cy="12" rx="10" ry="4.4"/>
          <ellipse cx="12" cy="12" rx="10" ry="4.4" transform="rotate(60 12 12)"/>
          <ellipse cx="12" cy="12" rx="10" ry="4.4" transform="rotate(120 12 12)"/>
          <circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/>
        </svg>
      </span>
      <span class="brand-text">
        <b>量界</b>
        <em>物理爱好者社区</em>
      </span>
    </a>

    <nav class="bar-nav" aria-label="主导航">
      <button class="bnav is-on" type="button" data-nav="home">讨论</button>
      <button class="bnav" type="button" data-nav="channels">频道</button>
      <button class="bnav" type="button" data-nav="tags">标签</button>
      <button class="bnav" type="button" data-nav="bookmarks">收藏</button>
    </nav>

    <button class="omni" type="button" data-action="omni">
      <i class="ti ti-search" aria-hidden="true"></i>
      <span class="omni-ph">搜公式、问题、标签</span>
      <kbd>⌘K</kbd>
    </button>

    <div class="bar-right">
      <button class="ibtn" type="button" data-action="theme" aria-label="切换主题">
        <i class="ti ti-moon" aria-hidden="true"></i>
      </button>
      <button class="ibtn has-dot" type="button" data-action="notify" aria-label="通知">
        <i class="ti ti-bell" aria-hidden="true"></i>
        <span class="dot" aria-hidden="true"></span>
      </button>
      <button class="compose" type="button" data-action="compose">
        <i class="ti ti-plus" aria-hidden="true"></i>提问
      </button>
      <button class="avatar" type="button" data-nav="me" aria-label="我的主页">
        <img src="https://api.dicebear.com/9.x/notionists/svg?seed=ChenYanbo&backgroundColor=transparent" alt="陈砚博" width="30" height="30">
      </button>
    </div>
  </header>

  <!-- ══════════════════════════════ 主体 ══════════════════════════════ -->
  <main class="stage">

    <!-- ─────────────── 首页：讨论流 ─────────────── -->
    <section class="pane is-on" data-pane="home">
      <div class="home-grid">

        <!-- 左：频道目录 -->
        <aside class="rail">
          <div class="rail-block">
            <h2 class="rail-h">频道</h2>
            <nav class="chan-list" id="chan-list"></nav>
          </div>

          <div class="rail-block">
            <h2 class="rail-h">本月热榜</h2>
            <ol class="hot-list" id="hot-list"></ol>
          </div>

          <div class="rail-block rail-stats" id="home-stats"></div>
        </aside>

        <!-- 右：主流水 -->
        <div class="feed">

          <header class="feed-head">
            <div class="fh-copy">
              <h1>今日讨论</h1>
              <p><span data-stat="threads">128</span> 个主题 · <span data-stat="active">37</span> 人在线</p>
            </div>
            <div class="seg" id="sort-seg" role="tablist" aria-label="排序">
              <button class="is-on" type="button" data-sort="hot">热门</button>
              <button type="button" data-sort="new">最新</button>
              <button type="button" data-sort="unanswered">待答</button>
            </div>
          </header>

          <div class="threads" id="thread-list"></div>

          <button class="more-btn" type="button" data-action="load-more">
            <span>加载更早的讨论</span>
            <i class="ti ti-chevron-down" aria-hidden="true"></i>
          </button>

        </div>
      </div>
    </section>

    <!-- ─────────────── 频道总览 ─────────────── -->
    <section class="pane" data-pane="channels">
      <header class="page-head">
        <h1>频道</h1>
        <p>按物理分支划分。选一个进入。</p>
      </header>
      <div class="chan-grid" id="chan-grid"></div>
    </section>

    <!-- ─────────────── 标签墙 ─────────────── -->
    <section class="pane" data-pane="tags">
      <header class="page-head">
        <h1>标签</h1>
        <p>被追问最多的概念。点开看相关推导。</p>
      </header>
      <div class="tag-wall" id="tag-wall"></div>
    </section>

    <!-- ─────────────── 收藏 ─────────────── -->
    <section class="pane" data-pane="bookmarks">
      <header class="page-head">
        <h1>收藏</h1>
        <p>存下的推导与讨论。</p>
      </header>
      <div class="threads" id="bookmark-list"></div>
    </section>

    <!-- ─────────────── 我的主页 ─────────────── -->
    <section class="pane" data-pane="me">
      <div class="me-grid">
        <aside class="me-card" id="me-card"></aside>
        <div class="me-main">
          <div class="seg" id="me-seg" role="tablist" aria-label="切换内容">
            <button class="is-on" type="button" data-tab="posts">提问</button>
            <button type="button" data-tab="answers">回答</button>
            <button type="button" data-tab="saved">收藏</button>
          </div>
          <div class="threads" id="me-list"></div>
        </div>
      </div>
    </section>

  </main>

  <!-- ══════════════════════════════ 详情抽屉 ══════════════════════════════ -->
  <div class="scrim" id="scrim" hidden></div>

  <aside class="drawer" id="drawer" hidden aria-label="主题详情">
    <div class="drawer-inner" id="drawer-inner"></div>
  </aside>

  <!-- ══════════════════════════════ 提问编辑器 ══════════════════════════════ -->
  <div class="modal" id="composer" hidden role="dialog" aria-modal="true" aria-label="发起提问">
    <div class="modal-inner">
      <header class="modal-head">
        <span class="mh-mark"><i class="ti ti-math-function" aria-hidden="true"></i></span>
        <div class="mh-copy">
          <h2>发起提问</h2>
          <p>写清条件、给出尝试、附上公式。</p>
        </div>
        <button class="ibtn" type="button" data-action="close-modal" aria-label="关闭">
          <i class="ti ti-x" aria-hidden="true"></i>
        </button>
      </header>

      <div class="modal-body">
        <div class="fld">
          <label for="cp-title">标题</label>
          <input id="cp-title" type="text" placeholder="例如：为什么光子没有静质量，但引力不为零" autocomplete="off">
        </div>

        <div class="fld">
          <label for="cp-body">正文</label>
          <div class="editor">
            <div class="ed-tools">
              <button type="button" data-tex="$$" title="行间公式">行间</button>
              <button type="button" data-tex="$" title="行内公式">行内</button>
              <button type="button" data-tex="\\frac{}{}" title="分式">分式</button>
              <button type="button" data-tex="\\sqrt{}" title="根式">根式</button>
              <button type="button" data-tex="\\sum_{}^{}" title="求和">求和</button>
              <button type="button" data-tex="\\int_{}^{}" title="积分">积分</button>
              <button type="button" data-tex="\\partial" title="偏导">偏导</button>
              <button type="button" data-tex="\\nabla" title="梯度">梯度</button>
            </div>
            <textarea id="cp-body" placeholder="已知：…&#10;尝试：…&#10;卡在：…"></textarea>
          </div>
          <p class="fld-hint">支持 $...$ 行内公式与 $$...$$ 行间公式</p>
        </div>

        <div class="fld">
          <label for="cp-chan">频道</label>
          <div class="chip-row" id="cp-chans"></div>
        </div>

        <div class="fld">
          <label for="cp-tag">标签</label>
          <input id="cp-tag" type="text" placeholder="用空格分隔，最多 4 个" autocomplete="off">
        </div>
      </div>

      <footer class="modal-foot">
        <button class="btn btn-ghost" type="button" data-action="close-modal">取消</button>
        <button class="btn btn-solid" type="button" data-action="submit-question">
          <i class="ti ti-send" aria-hidden="true"></i>发布提问
        </button>
      </footer>
    </div>
  </div>

  <!-- ══════════════════════════════ 命令面板 ══════════════════════════════ -->
  <div class="palette" id="palette" hidden role="dialog" aria-label="全局搜索">
    <div class="pal-field">
      <i class="ti ti-search" aria-hidden="true"></i>
      <input id="pal-input" type="text" placeholder="搜公式、问题、标签、频道" autocomplete="off" spellcheck="false">
      <kbd>ESC</kbd>
    </div>
    <div class="pal-list" id="pal-list"></div>
  </div>

  <!-- ══════════════════════════════ Toast ══════════════════════════════ -->
  <div class="toast" id="toast" hidden></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script src="app.js"></script>
</body>
</html>
