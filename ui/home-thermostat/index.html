<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#e5e7ee">
  <meta name="color-scheme" content="light">
  <title>Home — Smart living</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.49.0/dist/tabler-icons-300.min.css">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="stage">
    <div class="canvas" aria-label="Smart home app">
      <div class="status-bar" aria-hidden="true">
        <span>9:41</span>
        <div class="status-symbols">
          <svg viewBox="0 0 18 14"><path d="M1 10h3v4H1zm4-3h3v7H5zm4-3h3v10H9zm4-3h3v13h-3z" fill="currentColor"/></svg>
          <svg viewBox="0 0 18 14"><path d="M1 4a13 13 0 0 1 16 0M4 7a8 8 0 0 1 10 0M7 10a3 3 0 0 1 4 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="9" cy="13" r="1" fill="currentColor"/></svg>
          <svg class="battery" viewBox="0 0 28 14"><rect x="1" y="1" width="23" height="12" rx="3" fill="none" stroke="currentColor" stroke-width=".8"/><rect x="3" y="3" width="19" height="8" rx="1.5" fill="currentColor"/><path d="M26 5v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </div>
      </div>
      <main id="screen"></main>
      <nav class="bottom-nav" aria-label="Main navigation">
        <button type="button" data-nav="home" aria-label="Home" aria-current="page">
          <svg class="nav-home" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v11H3z"/><path d="M9 15h6v6H9z" class="house-door"/></svg>
        </button>
        <button type="button" data-nav="energy" aria-label="Energy"><svg class="nav-energy" viewBox="0 0 24 24" aria-hidden="true"><path d="m13 2-3 8H4l7 12 3-8h6z"/></svg></button>
        <button type="button" data-nav="scenes" aria-label="Scenes"><svg class="nav-scenes" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h4m4 0h10M3 12h12m4 0h2M3 18h4m4 0h10"/><circle cx="9" cy="6" r="2"/><circle cx="17" cy="12" r="2"/><circle cx="9" cy="18" r="2"/></svg></button>
      </nav>
      <div class="home-indicator" aria-hidden="true"></div>
    </div>
  </div>
</body>
</html>
